name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref instead of paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          # This repo stores ~619 MB of media in LFS and the free tier only
          # allows 1 GB of LFS bandwidth per month. CI needs source only.
          lfs: false

      - uses: actions/setup-python@v5
        with:
          # Matches the python:3.12-slim base image in backend/Dockerfile.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Byte-compile
        # scripts/ too: migrate.py is standalone and imported by nothing, so a
        # syntax error in it would otherwise only surface on the deploy host.
        run: python -m compileall -q app scripts

      - name: Import smoke test
        env:
          # app/db.py builds the engine at import time and raises when
          # DATABASE_URL is missing. create_async_engine is lazy, so this dummy
          # DSN is never dialled.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/postgres
        run: python -c "import app.main; print('routes:', len(app.main.app.openapi()['paths']))"

      - name: Unit tests
        run: python -m pytest tests/ -v

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          # Next.js 16 requires Node 20.9+.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Generates .next/types (PageProps/LayoutProps globals) that tsc
        # needs — running tsc directly against a fresh checkout without this
        # produces spurious errors on every dynamic route.
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
