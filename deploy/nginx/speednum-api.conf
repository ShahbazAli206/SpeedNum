# /etc/nginx/sites-available/speednum-api  (symlink into sites-enabled/)
#
# Install:
#   sudo cp speednum-api.conf /etc/nginx/sites-available/speednum-api
#   sudo ln -s /etc/nginx/sites-available/speednum-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.yourdomain.com
#
# certbot rewrites this file in place: it adds the listen 443 block, the
# certificate paths, and a redirect from :80. Run it after the file is in place
# and nginx is reloading cleanly, not before.

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    # Vercel will not send a bearer token to an untrusted certificate, and an
    # https frontend cannot call an http API at all — mixed content is blocked
    # in the browser. TLS here is not optional for this app to function.

    # Uploads go browser -> Supabase Storage directly, so nothing large passes
    # through here. This bounds a spreadsheet import, which is the biggest body
    # the API itself ever accepts.
    client_max_body_size 12M;

    # Free-tier Supabase can be slow to wake, and a bulk user import provisions
    # one Supabase Auth user per row. The default 60s cuts a legitimate import off.
    proxy_connect_timeout 15s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # deps.client_ip reads X-Forwarded-For for the audit trail, and uvicorn
        # runs with --proxy-headers. Without these every audited action is
        # recorded as coming from 127.0.0.1.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # The API is JSON; no buffering means errors surface immediately rather
        # than after nginx has collected a full response.
        proxy_buffering off;
    }

    # Health checks should not be in the access log — one line a minute, forever.
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }
}
