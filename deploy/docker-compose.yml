# SpeedNum stack on a Hostinger KVM VPS (or any Docker host).
#
#   cd /opt/speednum/deploy && docker compose up -d --build
#
# Four services: api (public, via the host's Caddy), postgres and minio
# (private, never published), migrate (a one-shot tool, not part of `up`).
#
# Two networks:
#   - `web`      external, created once with `docker network create web` and
#                already owning the host's Caddy container (see
#                /home/deploy/apps/caddy). `api` joins it so Caddy can reach
#                `speednum-api:8000` by name; `minio` joins it too, ONLY so
#                Caddy can reverse-proxy presigned-URL traffic to it under
#                /storage-api/* (see ../Caddyfile.example) — MinIO publishes no
#                host port either way, and its bucket has no anonymous policy,
#                so reachability over this shared bridge still requires a
#                valid signed S3 request, not just network access.
#   - `internal` project-local, created automatically by compose. postgres
#                lives here ONLY — nothing outside this compose project, and
#                nothing on the internet, can reach it. Never publish 5432.

services:
  postgres:
    image: postgres:16
    container_name: speednum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-speednum}
      POSTGRES_USER: ${POSTGRES_USER:-speednum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in api.env}
    volumes:
      # Bind-mounted rather than a named volume so a `docker compose down`
      # (without -v, which nothing here ever runs against production) can
      # never take the data with it, and so backups/restores in ../scripts
      # can reach the files directly.
      - /home/deploy/data/speednum/postgres:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-speednum} -d $${POSTGRES_DB:-speednum}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: speednum-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in api.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in api.env}
      # No public buckets, no browser UI needed on this deployment — the
      # console (9001) is never published and is reached only via
      # `docker exec`/an SSH tunnel if it is ever needed.
      MINIO_BROWSER: "off"
    volumes:
      - /home/deploy/data/speednum/minio:/data
    networks:
      - internal
      - web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # No `ports:` — see the network note above. Reached only by other
    # containers on `internal`/`web`, never by the host's public interface.

  # One-shot: creates the bucket and denies anonymous access, then exits.
  # Re-running is harmless (--ignore-existing, and `mc anonymous set none` is
  # idempotent) — this is provisioning, not a migration, so it is not tracked
  # the way schema changes are.
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: speednum-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - internal
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in api.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in api.env}
      S3_BUCKET: ${S3_BUCKET:-documents}
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        mc anonymous set none "local/$$S3_BUCKET"
    restart: "no"

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: speednum-api:latest
    container_name: speednum-api
    # The container is now your job rather than a PaaS's — this is what brings
    # it back after a crash, and after the VPS reboots.
    restart: unless-stopped
    env_file:
      - ./api.env
    environment:
      PORT: "8000"
      # 4 workers for a KVM 4's 4 vCPUs. Each runs its own reminder scheduler;
      # the Postgres advisory lock in services/scheduler.py means only one of
      # them actually sweeps.
      WEB_CONCURRENCY: "4"
      # These three reference ../deploy/.env (compose's own top-level env
      # file, auto-loaded for *.yml interpolation — a different mechanism
      # from api.env's `env_file:`, which is not interpolated). One password
      # each, defined once in .env, rather than pasted a second time into
      # api.env where it could drift. Anything api.env sets for these same
      # keys is overridden by this block (compose merges env_file first,
      # environment second) — leave them out of api.env entirely instead of
      # relying on that.
      #
      # sslmode=disable: this Postgres never terminates TLS (it's the plain
      # official image, reachable only over the `internal` Docker network,
      # never the internet) — without this, app/db.py's default of
      # sslmode=require makes asyncpg attempt an SSL handshake and the server
      # rejects the upgrade outright ("PostgreSQL server ... rejected SSL
      # upgrade"), which reads as a connection failure, not an auth one.
      # Supabase's pooler (the rollback DATABASE_URL in api.env) does
      # terminate TLS and needs this left at its default instead.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-speednum}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-speednum}?sslmode=disable
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - web
      - internal
    healthcheck:
      # Repeated from the Dockerfile so `docker compose ps` reports health even
      # if the image is ever rebuilt from a different base.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)",
        ]
      interval: 60s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      # Without this, container logs grow until they fill the disk — which on a
      # VPS takes the database connection down with everything else.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Schema migrations. Reuses the API image (asyncpg is already in it) so the
  # VPS needs no Python of its own.
  #
  #   docker compose run --rm migrate status
  #   docker compose run --rm migrate baseline 0004   # first time only, see DEPLOYMENT.md
  #   docker compose run --rm migrate apply
  #
  # The `tools` profile keeps it out of `docker compose up`: schema changes
  # should be a decision, not a side effect of restarting the API.
  migrate:
    profiles: ["tools"]
    image: speednum-api:latest
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ./api.env
    environment:
      MIGRATIONS_DIR: /migrations
      # See the `api` service's environment block above for why these three
      # are not read from api.env.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-speednum}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-speednum}?sslmode=disable
    volumes:
      # The image is built from backend/ alone and cannot reach ../db, so the
      # .sql files are mounted in at run time. Read-only: this container has no
      # business editing them.
      - ../db/migrations:/migrations:ro
    networks:
      - internal
    entrypoint: ["python", "scripts/migrate.py"]
    command: ["status"]
    restart: "no"

networks:
  web:
    external: true
  internal:
    driver: bridge
