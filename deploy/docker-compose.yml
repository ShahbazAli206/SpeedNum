# SpeedNum stack on a Hostinger KVM VPS (or any Docker host).
#
#   cd /opt/speednum/deploy && docker compose up -d --build
#
# Services: api and frontend (both public, via the host's Caddy), postgres
# and minio (private, never published), migrate (a one-shot tool, not part
# of `up`) — plus livekit and coturn for video calling (see their own
# comments below; unlike everything else here they use network_mode: host,
# not the two networks described below, for reasons specific to WebRTC).
#
# Two networks (used by every service except livekit/coturn):
#   - `web`      external, created once with `docker network create web` and
#                already owning the host's Caddy container (see
#                /home/deploy/apps/caddy). `api` joins it so Caddy can reach
#                `speednum-api:8000` by name; `minio` joins it too, ONLY so
#                Caddy can reverse-proxy presigned-URL traffic to it under
#                /storage-api/* (see ../Caddyfile.example) — MinIO publishes no
#                host port either way, and its bucket has no anonymous policy,
#                so reachability over this shared bridge still requires a
#                valid signed S3 request, not just network access.
#   - `internal` project-local, created automatically by compose. postgres
#                lives here ONLY — nothing outside this compose project, and
#                nothing on the internet, can reach it. Never publish 5432.

services:
  postgres:
    image: postgres:16
    container_name: speednum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-speednum}
      POSTGRES_USER: ${POSTGRES_USER:-speednum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in api.env}
    volumes:
      # Bind-mounted rather than a named volume so a `docker compose down`
      # (without -v, which nothing here ever runs against production) can
      # never take the data with it, and so backups/restores in ../scripts
      # can reach the files directly.
      - /home/deploy/data/speednum/postgres:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-speednum} -d $${POSTGRES_DB:-speednum}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: speednum-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in api.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in api.env}
      # No public buckets, no browser UI needed on this deployment — the
      # console (9001) is never published and is reached only via
      # `docker exec`/an SSH tunnel if it is ever needed.
      MINIO_BROWSER: "off"
    volumes:
      - /home/deploy/data/speednum/minio:/data
    networks:
      - internal
      - web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # No `ports:` — see the network note above. Reached only by other
    # containers on `internal`/`web`, never by the host's public interface.

  # One-shot: creates the bucket and denies anonymous access, then exits.
  # Re-running is harmless (--ignore-existing, and `mc anonymous set none` is
  # idempotent) — this is provisioning, not a migration, so it is not tracked
  # the way schema changes are.
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: speednum-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - internal
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in api.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in api.env}
      S3_BUCKET: ${S3_BUCKET:-documents}
      # Separate bucket for disaster-recovery backup snapshots — kept apart
      # from S3_BUCKET so a policy mistake on one can never expose the other.
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-backups}
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        mc anonymous set none "local/$$S3_BUCKET" &&
        mc mb --ignore-existing "local/$$BACKUP_S3_BUCKET" &&
        mc anonymous set none "local/$$BACKUP_S3_BUCKET"
    restart: "no"

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: speednum-api:latest
    container_name: speednum-api
    # The container is now your job rather than a PaaS's — this is what brings
    # it back after a crash, and after the VPS reboots.
    restart: unless-stopped
    env_file:
      - ./api.env
    environment:
      PORT: "8000"
      # 4 workers for a KVM 4's 4 vCPUs. Each runs its own reminder scheduler;
      # the Postgres advisory lock in services/scheduler.py means only one of
      # them actually sweeps.
      WEB_CONCURRENCY: "4"
      # These three reference ../deploy/.env (compose's own top-level env
      # file, auto-loaded for *.yml interpolation — a different mechanism
      # from api.env's `env_file:`, which is not interpolated). One password
      # each, defined once in .env, rather than pasted a second time into
      # api.env where it could drift. Anything api.env sets for these same
      # keys is overridden by this block (compose merges env_file first,
      # environment second) — leave them out of api.env entirely instead of
      # relying on that.
      #
      # sslmode=disable: this Postgres never terminates TLS (it's the plain
      # official image, reachable only over the `internal` Docker network,
      # never the internet) — without this, app/db.py's default of
      # sslmode=require makes asyncpg attempt an SSL handshake and the server
      # rejects the upgrade outright ("PostgreSQL server ... rejected SSL
      # upgrade"), which reads as a connection failure, not an auth one.
      # Supabase's pooler (the rollback DATABASE_URL in api.env) does
      # terminate TLS and needs this left at its default instead.
      #
      # POSTGRES_APP_USER, not POSTGRES_USER: the official postgres image
      # always makes POSTGRES_USER a full superuser at cluster init (there is
      # no image option to avoid this), so the application connects as a
      # separate, deliberately unprivileged role instead — see the note on
      # POSTGRES_APP_USER in .env.example and DEPLOYMENT.md's "Least-privilege
      # database role" section for the one-time setup.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER:-speednum_app}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-speednum}?sslmode=disable
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      # Shared with the `livekit` service below (its LIVEKIT_KEYS) — defined
      # once here rather than pasted into api.env too, same "one password,
      # never a second copy to drift" reasoning as DATABASE_URL above. The
      # api container only ever signs/verifies tokens locally with these; it
      # never needs network access to the livekit container itself.
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - web
      - internal
    healthcheck:
      # Repeated from the Dockerfile so `docker compose ps` reports health even
      # if the image is ever rebuilt from a different base.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)",
        ]
      interval: 60s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      # Without this, container logs grow until they fill the disk — which on a
      # VPS takes the database connection down with everything else.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* is inlined into the client bundle at build time, not read at container
      # runtime — so these have to be build args (interpolated from this project's top-level
      # .env, same mechanism DATABASE_URL below uses), not an `environment:`/`env_file:` entry
      # the way api.env works for the `api` service.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://test.spidnums.com}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.spidnums.com}
    image: speednum-frontend:latest
    container_name: speednum-frontend
    restart: unless-stopped
    networks:
      - web
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 60s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # No `ports:` — Caddy reaches it as `speednum-frontend:3000` over the `web` network, the
    # same way it reaches `speednum-api:8000` (see ../deploy/Caddyfile.example).

  # Self-hosted WebRTC SFU (video calling) — see VIDEO_CALL_PROGRESS.md and
  # DEPLOYMENT.md's "Video calling" section. `network_mode: host`, unlike
  # every service above: LiveKit needs a large UDP port range (50000-60000)
  # for WebRTC media, and Docker's bridge networking creates one iptables
  # DNAT rule per *published* port — fine for the handful every other
  # service here uses, prohibitively slow to stand up for ten thousand of
  # them. Host networking is LiveKit's own documented recommendation for
  # exactly this case and is what it binds 7880 (signaling)/7881 (ICE/TCP
  # fallback)/the UDP range directly on the VPS's own interface with — no
  # `ports:` list, and `network_mode: host` cannot be combined with
  # `networks:` in Compose, so it is deliberately absent from both `web` and
  # `internal`.
  #
  # Caddy (on the `web` network) therefore CANNOT reach this the way it
  # reaches speednum-api/speednum-frontend by container name — see
  # ../deploy/Caddyfile.example's video.spidnums.com block for the two ways
  # to bridge that gap, and DEPLOYMENT.md for which one this VPS actually
  # needs. Not yet verified against the real host.
  livekit:
    image: livekit/livekit-server:v1.13.6
    container_name: speednum-livekit
    restart: unless-stopped
    network_mode: host
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    environment:
      # Shared with the `api` service above — see its LIVEKIT_API_KEY/SECRET
      # comment. LiveKit accepts this as an env-var alternative to a `keys:`
      # block in the yaml file, so the actual secret is never written into
      # livekit.yaml (which is otherwise not secret at all — see
      # livekit.yaml.example's own header).
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # No healthcheck: with network_mode: host there is no container-private
    # loopback to probe that would actually distinguish "container broken"
    # from "host networking misconfigured" — a false negative would be worse
    # than no signal. Watch `docker logs speednum-livekit` and the VPS's own
    # port reachability instead until this has been run for real.

  # Self-hosted TURN/STUN relay, for callers whose network blocks direct
  # WebRTC UDP/TCP (corporate firewalls, some mobile carriers/hotels) — the
  # implementation spec's explicit "self-hosted coturn" decision, not a
  # managed TURN provider. Also `network_mode: host`, for the same reason as
  # `livekit` above and because coturn's own documentation recommends host
  # networking so its advertised relay address is unambiguously this VPS's
  # real public IP rather than a NATed Docker bridge address.
  coturn:
    image: coturn/coturn:4.17.2
    container_name: speednum-coturn
    restart: unless-stopped
    network_mode: host
    # The image's default CMD is `--log-file=stdout --external-ip=$(detect-external-ip)`
    # with no `-c`, so without this override turnserver.conf below is mounted
    # but never actually read — coturn silently falls back to built-in
    # defaults (no auth secret, no TLS cert, no custom relay port range),
    # which makes TURN relay fail for any client that needs it, with no
    # error visible anywhere except this log line at container startup:
    # "Cannot find config file: turnserver.conf. Default and command-line
    # settings will be used." Confirmed live on this VPS 2026-09-03.
    command: ["-c", "/etc/coturn/turnserver.conf"]
    # turnserver.conf and the TLS cert/key below are owned by deploy (uid
    # 1000) with turnserver.conf at 600 since it holds the shared TURN
    # secret. The image's default user is nobody (uid 65534), which cannot
    # read either — this must match the host file owner.
    user: "1000:1000"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      # TLS cert/key for the TURN/TLS listener (turnserver.conf's
      # tls-listening-port) — obtained separately from Caddy's own certs:
      # Caddy only terminates TLS for the HTTP(S) hosts it reverse-proxies,
      # and coturn speaks raw TURN-over-TLS, not HTTP, so it needs its own
      # certificate on disk. See DEPLOYMENT.md for how to obtain/renew one
      # for turn.spidnums.com.
      - /home/deploy/certs/turn.spidnums.com:/etc/coturn/certs:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Schema migrations. Reuses the API image (asyncpg is already in it) so the
  # VPS needs no Python of its own.
  #
  #   docker compose run --rm migrate status
  #   docker compose run --rm migrate baseline 0004   # first time only, see DEPLOYMENT.md
  #   docker compose run --rm migrate apply
  #
  # The `tools` profile keeps it out of `docker compose up`: schema changes
  # should be a decision, not a side effect of restarting the API.
  migrate:
    profiles: ["tools"]
    image: speednum-api:latest
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ./api.env
    environment:
      MIGRATIONS_DIR: /migrations
      # See the `api` service's environment block above for why these three
      # are not read from api.env. Same POSTGRES_APP_USER as `api`, not the
      # superuser — schema migrations don't need it either: pgcrypto/citext
      # are both "trusted" extensions (Postgres 13+), installable by a
      # non-superuser database owner, and ALTER DATABASE ... OWNER TO in the
      # one-time role setup already makes speednum_app exactly that.
      # Verified against a disposable from-scratch Postgres before this was
      # relied on here, not assumed.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER:-speednum_app}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-speednum}?sslmode=disable
    volumes:
      # The image is built from backend/ alone and cannot reach ../db, so the
      # .sql files are mounted in at run time. Read-only: this container has no
      # business editing them.
      - ../db/migrations:/migrations:ro
    networks:
      - internal
    entrypoint: ["python", "scripts/migrate.py"]
    command: ["status"]
    restart: "no"

networks:
  web:
    external: true
  internal:
    driver: bridge
